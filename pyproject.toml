[project]
name = "ayatiworks-tech"
version = "1.0.0"
description = "Ayatiworks Tech/CRM/PMS Backend"
requires-python = ">=3.11"

[tool.ruff]
# Target Python 3.11
target-version = "py311"

# Line length
line-length = 100

# Exclude directories
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "migrations",
    ".pytest_cache",
]

[tool.ruff.lint]
# Select linting rules
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "I",     # isort (import sorting)
    "N",     # pep8-naming
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "S",     # flake8-bandit (security)
]

# Ignore specific rules
ignore = [
    "E501",  # line too long (handled by formatter)
    "E712",  # SQLAlchemy boolean expressions intentionally use == True/False
    "S101",  # use of assert (ok in tests)
    "S104",  # binding to all interfaces (ok for containers)
    "B008",  # function call in default argument (FastAPI Depends pattern)
    "B904",  # existing API handlers intentionally translate internal exceptions
    "E402",  # some imports are intentionally delayed to avoid startup cycles/cost
    "N805",  # SQLAlchemy declared_attr receives cls by convention
    "N818",  # existing public exception class names are API-compatible
    "S105",  # token type strings are false positives
    "S106",  # token type arguments are false positives
    "S110",  # fallback paths intentionally swallow non-critical cache/email errors
    "S112",  # best-effort crawlers intentionally skip failed items
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["app"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# Tests can use assert and have longer lines
"tests/*" = ["S101", "E501", "S105", "S106"]
# Allow print in seed.py
"seed.py" = ["T201"]

[tool.ruff.format]
# Use double quotes
quote-style = "double"
# Use spaces for indentation
indent-style = "space"
# Respect magic trailing comma
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
